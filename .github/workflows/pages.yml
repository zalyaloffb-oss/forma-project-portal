name: Publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue and performance contracts
        run: |
          node tests/test-routing.mjs
          node tests/test-catalog-filters.mjs
          node tests/test-banners.mjs
          node tests/test-model-transport.mjs
          node tests/test-yandex-model.mjs
          node tests/test-asset-store.mjs
          python3 tests/test_yandex_connector.py
          python3 tests/test_cloud_publication.py
          python3 tests/test_fusion_dates.py
          python3 tests/test_catalog_classification.py
          python3 tests/test_performance.py
          python3 tools/validate_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - name: Wait for the Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          for attempt in {1..12}; do
            if gh api "$endpoint" \
              --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fx -- "$ARTIFACT_NAME"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_NAME did not become available"
          exit 1
      - name: Deploy
        id: deployment
        # Use REST artifact discovery: the newer v4 results service misses uploads.
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
